<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121722" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="40%" stop-color="rgba(99, 102, 241, 0.3)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.15)" />
    </linearGradient>

    <!-- Arc 1: Emerald Radiance (Surplus / Growth) -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Arc 2: Sky / Cyan Azure (Balance / Analytics) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Arc 3: Electric Indigo / Purple (AI Intelligence) -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Center AI Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="centerAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.15)" />
      <stop offset="60%" stop-color="rgba(16, 185, 129, 0.08)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>
  </defs>

  <!-- Squircle App Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#centerAmbient)" />

  <!-- Outer Wheel Glass Track Background -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="38" />

  <!-- Monefy Radial Wheel Segments (R=148, circumference ~930) -->
  <!-- Segment 1: Emerald Green Arc (length: 295, gap: 15) -->
  <circle cx="256" cy="256" r="148"
    fill="none"
    stroke="url(#emeraldGrad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-dasharray="280 650"
    stroke-dashoffset="-20"
    filter="url(#softGlow)" />

  <!-- Segment 2: Cyan Azure Arc -->
  <circle cx="256" cy="256" r="148"
    fill="none"
    stroke="url(#cyanGrad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-dasharray="280 650"
    stroke-dashoffset="-330"
    filter="url(#softGlow)" />

  <!-- Segment 3: Electric Indigo Arc -->
  <circle cx="256" cy="256" r="148"
    fill="none"
    stroke="url(#indigoGrad)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-dasharray="280 650"
    stroke-dashoffset="-640"
    filter="url(#softGlow)" />

  <!-- Inner Glass Ring Accent -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="178" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" />

  <!-- Center Core Display: AI Monefy Emblem -->
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="88" fill="#121722" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
  <circle cx="256" cy="256" r="88" fill="url(#centerAmbient)" />

  <!-- AI Monogram Typography & Star -->
  <g transform="translate(256, 256)" filter="url(#strongGlow)">
    <!-- Stylized 'A' -->
    <path d="M -48 34 L -24 -36 L 0 34 M -40 14 L -8 14"
      fill="none"
      stroke="url(#sparkGrad)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round" />

    <!-- Dynamic Orbit Swoosh across A -->
    <path d="M -56 22 Q -30 -10 16 0"
      fill="none"
      stroke="#34d399"
      stroke-width="4.5"
      stroke-linecap="round"
      opacity="0.9" />

    <!-- Stylized 'I' -->
    <path d="M 22 -14 L 22 34"
      fill="none"
      stroke="url(#sparkGrad)"
      stroke-width="10"
      stroke-linecap="round" />

    <!-- 4-point AI Star above I -->
    <!-- Center of star at (22, -32) -->
    <path d="M 22 -44 Q 22 -32 34 -32 Q 22 -32 22 -20 Q 22 -32 10 -32 Q 22 -32 22 -44 Z"
      fill="url(#sparkGrad)" />
    <circle cx="22" cy="-32" r="2.5" fill="#ffffff" />
  </g>
</svg>
